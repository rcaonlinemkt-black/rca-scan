<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>สแกนแอร์ RCA</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1f4d; color: #fff; font-family: 'Noto Sans Thai', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  .box { display: grid; gap: 14px; justify-items: center; }
  .dot { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .25); border-top-color: #ffd400; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 20px; background: #ffd400; color: #0b1f4d; font-weight: 700; }
</style>
</head>
<body>
<div class="box" id="box"><div class="dot"></div><div>กำลังโหลดแอปสแกนแอร์</div></div>
<script>
// หน้านี้เป็นตัวโหลด ดึงหน้าแอปล่าสุดจาก Apps Script ทุกครั้งที่เปิด
// แก้แอปที่ Apps Script แล้ว Deploy เวอร์ชันใหม่ หน้านี้ได้ของใหม่เอง ไม่ต้องอัปโหลด GitHub อีก
var API = 'https://script.google.com/macros/s/AKfycbw665Hi9qUi8q7SNf5EBQAlSvR1hZtasnY3Jb37K6UhxL52L7Df0qJrikkt5ofw4Z-zSQ/exec';
function fail(msg) {
  document.getElementById('box').innerHTML = '<div>' + msg + '</div><button type="button" onclick="location.reload()">ลองใหม่</button>';
}
fetch(API + '?raw=1&t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
  if (!r.ok) throw new Error(r.status);
  return r.text();
}).then(function (h) {
  if (h.indexOf('id="screenMain"') < 0) { fail('ฝั่งชีทยังเป็นโค้ดเก่า ให้แอดมินวาง Code.gs ใหม่แล้ว Deploy เวอร์ชันใหม่'); return; }
  var key = "var API_URL = '';";
  if (h.indexOf(key) < 0) { fail('หน้าแอปไม่ตรงรูปแบบ แจ้งแอดมิน'); return; }
  h = h.replace(key, "var API_URL = '" + API + "';");
  document.open(); document.write(h); document.close();
}).catch(function () { fail('โหลดแอปไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); });
</script>
</body>
</html>
